[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meetsum"
version = "0.1.0"
description = "Graph-based meeting summarization and action-item extraction (spaCy + Sentence-BERT + Personalized PageRank + MMR)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "spacy>=3.5",
    "networkx>=3.0",
    "numpy>=1.23",
    "scipy>=1.10",
    "scikit-learn>=1.2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
sbert = ["sentence-transformers>=2.2"]
eval = ["rouge-score>=0.1.2", "bert-score>=0.3.13"]
dev = ["pytest>=7", "ruff>=0.4"]
all = ["sentence-transformers>=2.2", "rouge-score>=0.1.2", "bert-score>=0.3.13", "pytest>=7", "ruff>=0.4"]

[project.scripts]
meetsum = "meetsum.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
